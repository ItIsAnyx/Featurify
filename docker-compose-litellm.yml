version: "3.9"

services:
  litellm_db:
    image: postgres:16
    container_name: litellm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    ports:
      - "5434:5432"
    volumes:
      - litellm_pg_data:/var/lib/postgresql/data

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    depends_on:
      - litellm_db
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://litellm:litellm@litellm_db:5432/litellm
      LITELLM_MASTER_KEY: sk-master-key
      STORE_MODEL_IN_DB: "True"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - ./litellm_config.yaml:/etc/litellm/config.yaml
    command:
      - "--config"
      - "/etc/litellm/config.yaml"
      - "--port"
      - "4000"

volumes:
  litellm_pg_data: